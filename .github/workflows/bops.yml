name: bops
on:
  push: { paths: ["bops/**", "SPEC.md", ".github/workflows/bops.yml"] }
  pull_request: { paths: ["bops/**", "SPEC.md"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bops } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bops/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: docs/COMMANDS.md is in sync with the manifest
        run: go run ./cmd/bops gen docs | diff - ../docs/COMMANDS.md
  replicas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: bops } }
    env:
      BD_VERSION: 1.3.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bops/go.mod }
      - name: Install bd ${{ env.BD_VERSION }}, verified against its checksums
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}"
          tarball="beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" bd
          sudo install bd /usr/local/bin/bd
          bd version
      - name: Two-replica suite and live ledger tests
        env:
          BOPS_INTEGRATION: "1"
        run: go test -v -count=1 -timeout 40m ./cmd/bops ./internal/intent
