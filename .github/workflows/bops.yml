name: bops
on:
  push: { paths: ["bops/**", "SPEC.md", ".github/workflows/bops.yml", "bindings/claude-code/**", "bindings/codex/**", "bindings/clojure/**", ".claude/skills/bops/**", ".agents/skills/bops/**", "scripts/check-bindings.sh"] }
  pull_request: { paths: ["bops/**", "SPEC.md", "bindings/claude-code/**", "bindings/codex/**", "bindings/clojure/**", ".claude/skills/bops/**", ".agents/skills/bops/**", "scripts/check-bindings.sh"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bops } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bops/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: docs/COMMANDS.md is in sync with the manifest
        run: go run ./cmd/bops gen docs | diff - ../docs/COMMANDS.md
      - name: The Claude Code, Codex and Clojure bindings are in sync with the manifest
        run: sh ../scripts/check-bindings.sh
  replicas:
    # Raw JSON and bd's envelope (BD_JSON_ENVELOPE=1, bd 2.0's default) in
    # parallel, so a parse that only works in one mode fails here.
    name: replicas (bd JSON envelope=${{ matrix.envelope }})
    strategy:
      fail-fast: false
      matrix:
        envelope: ["0", "1"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: bops } }
    env:
      BD_VERSION: 1.3.4
    # A dolt sql-server for the server-mode ledger that deps --engine cte
    # needs (bd sql does not run on an embedded ledger).
    services:
      dolt:
        image: dolthub/dolt-sql-server:2.7.3
        env: { DOLT_ROOT_HOST: "%" }
        ports: ["3306:3306"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bops/go.mod }
      - name: Install bd ${{ env.BD_VERSION }}, verified against its checksums
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}"
          tarball="beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" bd
          sudo install bd /usr/local/bin/bd
          bd version
      - name: Wait for the dolt sql-server
        run: for i in $(seq 60); do nc -z 127.0.0.1 3306 && exit 0; sleep 1; done; exit 1
      # Dolt's background statistics job recomputes after the test's bulk
      # load, which may be what slowed the first cte query past bd sql's 10s
      # read timeout on a 2-CPU runner (bops-oy9.6). Stop it.
      - name: Stop the dolt sql-server's statistics job
        run: docker exec ${{ job.services.dolt.id }} dolt sql -q "call dolt_stats_stop()"
      - name: Two-replica suite and live ledger tests
        env:
          BOPS_INTEGRATION: "1"
          BD_JSON_ENVELOPE: ${{ matrix.envelope }}
        run: go test -v -count=1 -timeout 40m -skip TestLiveDepsCTEMatchesBD ./cmd/bops ./internal/intent
      # On its own, so the replica suites do not compete with the server for
      # the runner's CPUs: bd sql has a 10s read timeout.
      - name: deps --engine cte against the dolt sql-server
        env:
          BOPS_INTEGRATION: "1"
          BOPS_DOLT_SERVER: 127.0.0.1:3306
          BD_JSON_ENVELOPE: ${{ matrix.envelope }}
        run: go test -v -count=1 -timeout 10m -run TestLiveDepsCTEMatchesBD ./internal/intent
